# ───────────────────────────────────────────────
#  Prometheus Configuration — FlashPass
#  Scrapes metrics from the backend API every 5s
# ───────────────────────────────────────────────

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "flashpass-backend"
    static_configs:
      - targets: ["backend:4000"]
    metrics_path: "/api/admin/metrics"
    scrape_interval: 5s

  - job_name: "flashpass-worker"
    static_configs:
      - targets: ["worker:4000"]
    metrics_path: "/api/admin/metrics"
    scrape_interval: 10s
